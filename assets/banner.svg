<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 48px;
      font-weight: 900;
      fill: url(#text-grad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 500;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #38bdf8;
      letter-spacing: 1px;
    }

    /* CSS Animations for Dynamic Flow */
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatCard2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
      100% { transform: translateY(0px); }
    }

    .animated-bg-1 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 200px 100px; }
    .animated-bg-2 { animation: pulseGlow 8s ease-in-out infinite reverse; transform-origin: 1000px 260px; }
    .floating-card-1 { animation: floatCard1 5s ease-in-out infinite; }
    .floating-card-2 { animation: floatCard2 6s ease-in-out infinite; }
    .pulse-line { stroke-dasharray: 10 15; animation: dashMove 3s linear infinite; }
  </style>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1196" height="356" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Dynamic Animated Background Orbs (Behind everything) -->
  <circle class="animated-bg-1" cx="180" cy="90" r="140" fill="#3b82f6" filter="url(#glow)" opacity="0.25" />
  <circle class="animated-bg-2" cx="1020" cy="270" r="160" fill="#8b5cf6" filter="url(#glow)" opacity="0.25" />

  <!-- Background Asset Grid Pattern (Subtle) -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" />
    <path d="M 150 0 L 150 360 M 300 0 L 300 360 M 450 0 L 450 360 M 600 0 L 600 360 M 750 0 L 750 360 M 900 0 L 900 360 M 1050 0 L 1050 360" />
  </g>

  <!-- Decorative Dynamic Asset Flow Nodes (Floating in background/sides) -->
  <g class="floating-card-1" opacity="0.8">
    <rect x="70" y="220" width="130" height="80" rx="10" fill="url(#card-grad-1)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="100" cy="250" r="12" fill="#38bdf8" opacity="0.3" />
    <rect x="122" y="245" width="60" height="10" rx="4" fill="#38bdf8" opacity="0.5" />
    <rect x="90" y="275" width="92" height="8" rx="4" fill="#64748b" opacity="0.4" />
  </g>

  <g class="floating-card-2" opacity="0.8">
    <rect x="1000" y="60" width="130" height="80" rx="10" fill="url(#card-grad-2)" stroke="#c084fc" stroke-width="1" />
    <circle cx="1030" cy="90" r="12" fill="#c084fc" opacity="0.3" />
    <rect x="1052" y="85" width="60" height="10" rx="4" fill="#c084fc" opacity="0.5" />
    <rect x="1020" y="115" width="92" height="8" rx="4" fill="#64748b" opacity="0.4" />
  </g>

  <!-- Dynamic Connecting Data Flow Line -->
  <path class="pulse-line" d="M 120 220 C 300 120, 900 240, 1050 140" fill="none" stroke="url(#line-grad)" stroke-width="2" />

  <!-- Center Foreground Content Shield (Ensures titles remain crisp & perfectly readable) -->
  <rect x="230" y="45" width="740" height="270" rx="20" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5" filter="url(#glow)" />

  <!-- Category Tag / Badge -->
  <g transform="translate(485, 75)">
    <rect width="230" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="115" y="20" text-anchor="middle" class="badge-text">DIGITAL ASSET MANAGEMENT</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="165" text-anchor="middle" class="title">Awesome DAM Ecosystem</text>

  <!-- Subtitle -->
  <text x="600" y="215" text-anchor="middle" class="subtitle">Curated SaaS Platforms, Open-Source Repos &amp; Media Pipelines</text>

  <!-- Metrics / Features Pill Indicators -->
  <g transform="translate(370, 255)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="65" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🚀 SaaS Pricing</text>
    
    <!-- Pill 2 -->
    <rect x="150" y="0" width="160" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="230" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#818cf8">⭐ Open-Source Repos</text>

    <!-- Pill 3 -->
    <rect x="330" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="395" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c084fc">📊 Market Insights</text>
  </g>
</svg>
